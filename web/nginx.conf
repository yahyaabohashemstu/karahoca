# ─── KARAHOCA frontend (static SPA) ────────────────────────────────────────
# nginx serves the built Vite output. The backend lives on a separate
# subdomain (api.karahoca.com) — this server does NOT proxy /api/* anywhere.
# Cross-origin calls go directly from the browser to api.karahoca.com.

server {
    listen      80;
    listen      [::]:80;
    server_name _;

    root        /usr/share/nginx/html;
    index       index.html;

    # Sane security defaults. CSP/HSTS belong on the edge proxy (Coolify /
    # Cloudflare) so they can be tuned without rebuilding the image.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── MIME corrections ────────────────────────────────────────────────────
    # Opening a `types { }` block REPLACES the http-level mime.types include
    # (it does NOT merge). So we must re-list every extension we serve —
    # missing text/html here is what made browsers download index.html as
    # application/octet-stream instead of rendering it.
    # The default mime.types is also missing .mjs / .webmanifest / .wasm,
    # which is what motivated having this block in the first place.
    types {
        text/html                     html htm;
        text/css                      css;
        text/plain                    txt;
        text/xml                      xml;
        application/javascript        js mjs;
        application/wasm              wasm;
        application/manifest+json     webmanifest;
        application/json              json;
        application/pdf               pdf;
        application/rss+xml           rss;
        application/atom+xml          atom;
        image/svg+xml                 svg svgz;
        image/webp                    webp;
        image/avif                    avif;
        image/png                     png;
        image/jpeg                    jpg jpeg;
        image/gif                     gif;
        image/x-icon                  ico;
        font/woff                     woff;
        font/woff2                    woff2;
        font/ttf                      ttf;
        font/otf                      otf;
        audio/mpeg                    mp3;
        video/mp4                     mp4;
    }
    default_type application/octet-stream;

    # ── Compression ─────────────────────────────────────────────────────────
    # Two-tier strategy:
    #
    # 1. Pre-compressed static files (`.br` and `.gz` siblings) created by
    #    `scripts/compress-static.mjs` at build time. nginx serves the
    #    matching pre-compressed file directly when the client supports the
    #    encoding — zero compression CPU per request and we get to use the
    #    highest compression levels (Brotli 11, gzip 9) which are too slow
    #    for per-request use.
    #
    # 2. On-the-fly compression as a fallback for any text response that
    #    didn't get a pre-compressed sibling at build time (proxied
    #    sitemap, dynamic error pages, etc.).
    #
    # `brotli_static on` requires the brotli module to be loaded (see top
    # of file via `load_module`). If the module is missing nginx warns at
    # startup and silently ignores the directive — gzip_static still wins
    # for clients that lack Brotli support.
    gzip_static       on;
    brotli_static     on;

    # On-the-fly fallback (rarely triggered now that static is pre-compressed).
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        application/manifest+json
        image/svg+xml
        font/ttf
        font/otf;

    # NOTE: each `brotli*` directive lives on a SINGLE line so the
    # build-time fallback in web/Dockerfile can comment them out with a
    # simple `sed -i 's/^\(\s*\)brotli/\1#brotli/g'` if the Alpine brotli
    # module turns out to be ABI-incompatible with the upstream nginx
    # image. A multi-line `brotli_types` declaration would orphan its
    # mime-type continuation lines after commenting the leading directive,
    # producing `unknown directive "text/plain"` errors at startup.
    brotli            on;
    brotli_comp_level 5;
    brotli_min_length 1024;
    brotli_types      text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml application/manifest+json image/svg+xml font/ttf font/otf;

    # ── Cache policy ────────────────────────────────────────────────────────
    # Vite emits hashed assets under /assets/, so they're safe to cache forever.
    location ^~ /assets/ {
        access_log    off;
        expires       1y;
        add_header    Cache-Control "public, max-age=31536000, immutable";
        try_files     $uri =404;
    }

    # Static media files (images, fonts, etc.) at the root — long cache OK,
    # filenames are stable enough that bumping is rare and we can purge via
    # Cloudflare if needed.
    location ~* \.(?:webp|png|jpe?g|gif|svg|ico|woff2?|ttf|otf|pdf|webmanifest|mp3)$ {
        access_log    off;
        expires       30d;
        add_header    Cache-Control "public, max-age=2592000";
        try_files     $uri =404;
    }

    # HTML must never be cached — the SPA shell points at hashed bundles
    # whose names change on every deploy.
    location = /index.html {
        add_header    Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header    Pragma "no-cache" always;
        add_header    Expires "0" always;
    }

    # ── /sitemap.xml — proxy to the API (dynamic, DB-driven) ───────────────
    # The sitemap is generated at request time from the products + news
    # tables and now carries Google Image-sitemap entries for every
    # product photo. We can't bake a static dist/sitemap.xml because it
    # would go stale the moment an admin edits a product or publishes a
    # news article. Proxy specifically `/sitemap.xml` (single URL, not a
    # blanket /api/* opening) so Googlebot fetching karahoca.com/sitemap.xml
    # gets the freshest copy without learning about the api subdomain.
    location = /sitemap.xml {
        proxy_pass              https://api.karahoca.com/sitemap.xml;
        proxy_ssl_server_name   on;
        proxy_set_header        Host api.karahoca.com;
        proxy_set_header        X-Forwarded-For $remote_addr;
        proxy_set_header        X-Forwarded-Proto $scheme;
        proxy_http_version      1.1;
        proxy_read_timeout      30s;
        proxy_connect_timeout   10s;
        # Override the upstream's max-age=3600 with a slightly shorter TTL
        # so an admin's product update appears in the sitemap within an
        # hour even if multiple edge layers cache aggressively.
        proxy_hide_header       Cache-Control;
        add_header              Cache-Control "public, max-age=900" always;
    }

    # ── SPA fallback ────────────────────────────────────────────────────────
    # Any non-asset path falls back to index.html so react-router can do its
    # job. `try_files` keeps real files (e.g. /robots.txt) intact.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Defence-in-depth ────────────────────────────────────────────────────
    # Nothing under /api/ should ever resolve here — the backend is on a
    # separate subdomain. Returning 404 makes accidental relative-URL bugs
    # in the SPA loud rather than silently 200-ing the index.html shell.
    location /api/ {
        return 404;
    }

    # Hide dotfiles (.env etc.) just in case a build slip-up leaks one.
    location ~ /\. {
        deny  all;
        access_log off;
        log_not_found off;
    }
}
