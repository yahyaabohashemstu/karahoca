# ─── KARAHOCA frontend (static SPA) ────────────────────────────────────────
# nginx serves the built Vite output. The backend lives on a separate
# subdomain (api.karahoca.com) — this server does NOT proxy /api/* anywhere.
# Cross-origin calls go directly from the browser to api.karahoca.com.
#
# This file is copied to /etc/nginx/conf.d/default.conf, i.e. it is included
# inside the `http { }` block — so the `map`s below are legal here.
#
# Status codes (what crawlers see):
#   /ar/ … /ru/ and the known pages under them   → 200 (prerendered HTML when
#                                                  the build has it, else the
#                                                  SPA shell)
#   /xx/news/<slug>, /xx/blog/<slug>              → 200 (the app shows its own
#                                                  noindex "not found" for an
#                                                  unknown slug)
#   /xx/aylux/  (trailing slash), /xx (no slash)  → 301 to the canonical form
#   /, /aylux, /news/<slug> … (no language)       → 302 to the visitor's language
#   www.karahoca.com/…                            → 301 to karahoca.com/…
#   anything else                                 → 404 with the SPA shell, so
#                                                  visitors still get the app's
#                                                  Not-Found page

# ── Visitor language for language-less URLs ────────────────────────────────
# Same order as the app (src/utils/localizedPath.ts → detectPreferredLang):
# the language the visitor picked (mirrored into the `kh_lang` cookie), then
# the first supported language in Accept-Language, then Arabic.
map $cookie_kh_lang $kh_lang_cookie {
    default         "";
    "~^(ar|en|tr|ru)$"  $1;
}
map "$kh_lang_cookie|$http_accept_language" $kh_lang {
    default                                                  ar;
    "~^(?<kh_c>ar|en|tr|ru)\|"                               $kh_c;
    "~*^\|(?:[^,]*,)*?\s*(?<kh_a>ar|en|tr|ru)(?:[-_;,\s]|$)"  $kh_a;
}

# ── Response headers, decided per final URI ─────────────────────────────────
# Every header is set once, at server level, from these maps. nginx drops
# ALL server-level add_header directives in any location that has its own
# add_header — which is how the HTML once went out with no security headers
# at all. So: no add_header inside locations; route-specific values come
# from maps or from variables a location sets.
map $uri $kh_cache_control {
    default                                                              "no-cache, must-revalidate";
    # Regexes are tried in order. Proxied API responses come FIRST and keep
    # the upstream's own Cache-Control (an empty value means "don't add the
    # header") — /og/…png would otherwise also match the image rule below
    # and go out with two Cache-Control headers.
    "~^/(?:og|share)/"                                                   "";
    "~^/assets/"                                                         "public, max-age=31536000, immutable";
    "~*\.(?:webp|avif|png|jpe?g|gif|svg|ico|woff2?|ttf|otf|pdf|webmanifest|mp3|mp4)$"  "public, max-age=2592000";
    /sitemap.xml                                                         "public, max-age=900";
}
map $request_uri $kh_robots {
    default                 "";
    "~^/admin(?:[/?#]|$)"   "noindex, nofollow";
}

server {
    listen      80;
    listen      [::]:80;
    server_name _;

    root        /usr/share/nginx/html;
    index       index.html;

    # Don't advertise the nginx version in the Server header / error pages.
    server_tokens off;

    # Redirects carry a path only ("Location: /ar/"). An absolute one would be
    # built from what nginx sees behind the edge proxy — http and the
    # internal port — sending visitors on an extra http→https hop.
    absolute_redirect off;

    # One host: www.karahoca.com served a full duplicate of the site.
    if ($host ~* ^www\.(.+)$) {
        return 301 https://$1$request_uri;
    }

    # ── Headers (see the maps above) ────────────────────────────────────────
    set $kh_vary "";
    add_header    Cache-Control $kh_cache_control always;
    add_header    X-Robots-Tag $kh_robots always;
    add_header    Vary $kh_vary always;
    add_header    X-Content-Type-Options "nosniff" always;
    add_header    X-Frame-Options "SAMEORIGIN" always;
    add_header    Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header    Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # The edge only ever serves this site over https; tell browsers to skip
    # the http hop on later visits. No includeSubDomains/preload on purpose.
    add_header    Strict-Transport-Security "max-age=31536000" always;

    # text/html had no charset parameter ("Content-Type: text/html").
    charset       utf-8;
    # (text/html is always included; listing it again is a config warning)
    charset_types text/css text/plain text/xml application/javascript application/json application/manifest+json;

    # ── MIME corrections ────────────────────────────────────────────────────
    # Opening a `types { }` block REPLACES the http-level mime.types include
    # (it does NOT merge). So we must re-list every extension we serve —
    # missing text/html here is what made browsers download index.html as
    # application/octet-stream instead of rendering it.
    # The default mime.types is also missing .mjs / .webmanifest / .wasm,
    # which is what motivated having this block in the first place.
    types {
        text/html                     html htm;
        text/css                      css;
        text/plain                    txt;
        text/xml                      xml;
        application/javascript        js mjs;
        application/wasm              wasm;
        application/manifest+json     webmanifest;
        application/json              json;
        application/pdf               pdf;
        application/rss+xml           rss;
        application/atom+xml          atom;
        image/svg+xml                 svg svgz;
        image/webp                    webp;
        image/avif                    avif;
        image/png                     png;
        image/jpeg                    jpg jpeg;
        image/gif                     gif;
        image/x-icon                  ico;
        font/woff                     woff;
        font/woff2                    woff2;
        font/ttf                      ttf;
        font/otf                      otf;
        audio/mpeg                    mp3;
        video/mp4                     mp4;
    }
    default_type application/octet-stream;

    # ── Compression ─────────────────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        application/manifest+json
        image/svg+xml
        font/ttf
        font/otf;

    # ── Health probe (Dockerfile HEALTHCHECK) ───────────────────────────────
    location = /healthz {
        access_log    off;
        default_type  text/plain;
        return        200 "ok";
    }

    # ── Static files ────────────────────────────────────────────────────────
    # Vite emits hashed assets under /assets/, so they're safe to cache forever.
    location ^~ /assets/ {
        access_log    off;
        try_files     $uri =404;
    }

    # Static media files (images, fonts, etc.) at the root — long cache OK,
    # filenames are stable enough that bumping is rare and we can purge via
    # Cloudflare if needed.
    location ~* \.(?:webp|avif|png|jpe?g|gif|svg|ico|woff2?|ttf|otf|pdf|webmanifest|mp3|mp4)$ {
        access_log    off;
        try_files     $uri =404;
    }

    # The SPA shell (also the body of every 404, via error_page below).
    location = /index.html {
    }

    # ── Site pages ──────────────────────────────────────────────────────────
    # Each route serves its prerendered HTML when the build produced one
    # (dist/<lang>/<page>/index.html) and the SPA shell otherwise.
    # `$uri/index.html` is a FILE check on purpose: `$uri/` would make nginx
    # retry as "/<page>/", which the trailing-slash rule below redirects back
    # — a loop.

    # Language home: /ar/ … /ru/
    location ~ ^/(ar|en|tr|ru)/$ {
        try_files     /$1/index.html /index.html;
    }

    # /ar → /ar/ (home is the only route whose canonical URL ends in "/")
    location ~ ^/(ar|en|tr|ru)$ {
        return        301 /$1/$is_args$args;
    }

    # Known pages, canonical form (no trailing slash).
    location ~ ^/(?:ar|en|tr|ru)/(?:about|news|blog|diox|aylux|production|goal|dryer|wishlist|unsubscribe|privacy|terms)$ {
        try_files     $uri/index.html /index.html;
    }

    # News and blog articles. nginx can't know which slugs exist (articles
    # are published without a redeploy), so an unknown slug gets the shell
    # and the app's own noindex "not found" page.
    location ~ ^/(?:ar|en|tr|ru)/(?:news|blog)/[^/]+$ {
        try_files     $uri/index.html /index.html;
    }

    # Same pages with a trailing slash → the canonical form.
    location ~ ^/(?:ar|en|tr|ru)/(?:(?:about|news|blog|diox|aylux|production|goal|dryer|wishlist|unsubscribe|privacy|terms)|(?:news|blog)/[^/]+)/$ {
        # From $request_uri (still percent-encoded), minus the final "/".
        if ($request_uri ~ "^(?<kh_path>[^?]*[^/?])/+(?<kh_query>\?.*)?$") {
            return    301 $kh_path$kh_query;
        }
        return        404;
    }

    # ── URLs without a language ─────────────────────────────────────────────
    # "/" and links from before the language prefix (/aylux, /news/<slug>…)
    # go to the visitor's language. 302 + Vary: the target depends on the
    # visitor, so neither browsers nor shared caches may store it as THE
    # answer for this URL.
    location = / {
        set           $kh_vary "Accept-Language, Cookie";
        return        302 /$kh_lang/;
    }
    location ~ ^/(?:(?:about|news|blog|diox|aylux|production|goal|dryer|wishlist|unsubscribe|privacy|terms)|(?:news|blog)/[^/]+)/?$ {
        set           $kh_vary "Accept-Language, Cookie";
        return        302 /$kh_lang$request_uri;
    }

    # Admin panel (client-side routes under /admin). Kept out of search
    # results by the X-Robots-Tag map above.
    location ~ ^/admin(?:/.*)?$ {
        try_files     /index.html =404;
    }

    # ── /sitemap.xml — proxy to the API (dynamic, DB-driven) ───────────────
    # The sitemap is generated at request time from the products + news
    # tables and now carries Google Image-sitemap entries for every
    # product photo. We can't bake a static dist/sitemap.xml because it
    # would go stale the moment an admin edits a product or publishes a
    # news article. Proxy specifically `/sitemap.xml` (single URL, not a
    # blanket /api/* opening) so Googlebot fetching karahoca.com/sitemap.xml
    # gets the freshest copy without learning about the api subdomain.
    location = /sitemap.xml {
        proxy_pass              https://api.karahoca.com/sitemap.xml;
        proxy_ssl_server_name   on;
        proxy_set_header        Host api.karahoca.com;
        proxy_set_header        X-Forwarded-For $remote_addr;
        proxy_set_header        X-Forwarded-Proto $scheme;
        proxy_http_version      1.1;
        proxy_read_timeout      30s;
        proxy_connect_timeout   10s;
        # Override the upstream's max-age=3600 with the map's 15 minutes so
        # an admin's product update appears quickly even if several edge
        # layers cache aggressively.
        proxy_hide_header       Cache-Control;
    }

    # ── /share/* — per-product share interstitial (Phase F2) ───────────────
    # WhatsApp / Facebook / Twitter crawlers fetch karahoca.com/share/product/
    # {id} to read OG meta tags pointing at the product's actual photograph.
    # The interstitial then redirects real browsers to the SPA deep-link.
    # Proxying here (instead of using api.karahoca.com directly) keeps the
    # visible URL on the trusted brand domain — crucial for click-through
    # rates on shared links.
    location ^~ /share/ {
        proxy_pass              https://api.karahoca.com;
        proxy_ssl_server_name   on;
        proxy_set_header        Host api.karahoca.com;
        proxy_set_header        X-Forwarded-For $remote_addr;
        proxy_set_header        X-Forwarded-Proto $scheme;
        proxy_http_version      1.1;
        proxy_read_timeout      15s;
        proxy_connect_timeout   10s;
        # The interstitial sets its own short cache-control (5 min); we
        # leave it intact so admin product edits propagate quickly.
    }

    # ── /og/* — runtime OG image generator (Phase F2 fallback path) ────────
    # Lets SEO/og meta point at karahoca.com/og/product/... rather than
    # api.karahoca.com/og/... — same rationale as /share/: trusted domain
    # in social-platform previews. Browsers fetching the og:image URL
    # never see api.karahoca.com.
    location ^~ /og/ {
        proxy_pass              https://api.karahoca.com;
        proxy_ssl_server_name   on;
        proxy_set_header        Host api.karahoca.com;
        proxy_set_header        X-Forwarded-For $remote_addr;
        proxy_set_header        X-Forwarded-Proto $scheme;
        proxy_http_version      1.1;
        proxy_read_timeout      30s;
        proxy_connect_timeout   10s;
    }

    # ── Defence-in-depth ────────────────────────────────────────────────────
    # Nothing under /api/ should ever resolve here — the backend is on a
    # separate subdomain. Returning 404 makes accidental relative-URL bugs
    # in the SPA loud rather than silently 200-ing the index.html shell.
    location ^~ /api/ {
        return 404;
    }

    # Hide dotfiles (.env etc.) just in case a build slip-up leaks one.
    location ~ /\. {
        deny  all;
        access_log off;
        log_not_found off;
    }

    # ── Everything else ─────────────────────────────────────────────────────
    # Real files at the root (robots.txt, humans.txt, sw.js …) are served;
    # any other path is a 404 whose body is the SPA shell, so the visitor
    # still sees the site's Not-Found page while crawlers get a real 404
    # (it used to be a 200 for every made-up URL).
    location / {
        try_files     $uri =404;
        error_page    404 /index.html;
    }
}
