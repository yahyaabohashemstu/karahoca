name: CI

# ─────────────────────────────────────────────────────────────────────────
# Trigger configuration
# ─────────────────────────────────────────────────────────────────────────
# Currently set to MANUAL ONLY (`workflow_dispatch`) because the repository
# owner's GitHub Actions billing is paused — automatic runs on every push
# would otherwise fire failure-notification emails for every commit.
#
# To re-enable automatic runs once billing is resolved, replace the `on:`
# block with the auto trigger below:
#
#   on:
#     push:
#       branches: [main]
#     pull_request:
#       branches: [main]
#
# And configure branch protection on main to require this workflow.
# ─────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint + typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: TypeScript — strict build check
        run: npx tsc -b

      - name: ESLint
        run: npm run lint

  tests:
    name: Server tests (vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Vitest
        run: npm test

  build:
    name: Full build (vite + prerender)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Prerender needs a real DOM; we don't require the API server here —
    # the prerender script runs against a local static server it boots
    # itself, and falls back gracefully if Chromium / Puppeteer is absent.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium runtime deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fonts-liberation libasound2 libatk-bridge2.0-0 libatk1.0-0 \
            libatspi2.0-0 libcups2 libdbus-1-3 libdrm2 libgbm1 libgtk-3-0 \
            libnspr4 libnss3 libx11-xcb1 libxcomposite1 libxdamage1 \
            libxfixes3 libxrandr2 libxkbcommon0 xdg-utils
        # Puppeteer downloaded its own Chromium during `npm ci`; we only
        # install the system-level .so files it links against.

      - name: Build (includes prerender)
        run: npm run build
        env:
          # Skip prerender if the puppeteer binary failed to download (very
          # rare CI-infra edge case). The build itself still must succeed.
          SKIP_PRERENDER: '0'

      - name: Verify dist is non-trivial
        run: |
          test -f dist/index.html
          test -s dist/index.html
          ls -la dist/ | head -20
