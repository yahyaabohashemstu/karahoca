<!doctype html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/webp" href="/cropped-karahoca-logo-s-.webp" />
  <link rel="shortcut icon" href="/cropped-karahoca-logo-s-.webp" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KARAHOCA — الرئيسية</title>
  <meta name="description" content="منظفات بجودة عالمية — ابتكار، نقاء، وأداء خارق.">
  <!-- Inter is self-hosted via @fontsource/inter (see src/main.tsx). No
       runtime dependency on fonts.gstatic.com / fonts.googleapis.com — the
       woff2 subsets are bundled into the Vite output so the first paint
       doesn't pay a DNS + TLS handshake for the font CDN. -->
  <meta name="robots" content="index, follow">
  <!-- Intentionally omitted preconnect to Google Fonts; it would create a
       wasteful round-trip to a domain we no longer use. -->
  <link rel="dns-prefetch" href="https://wa.me">

  <!-- Warm the TCP+TLS handshake to the API host BEFORE the first SPA
       fetch fires (CSRF bootstrap, brand catalog, etc.). Saves the
       ~100-300ms DNS+TCP+TLS round-trip on first paint for visitors
       hitting the live origin. The dns-prefetch is a fallback for
       older browsers that don't honour preconnect. The crossorigin
       attribute matches the credentialed CORS mode of our fetches. -->
  <link rel="preconnect" href="https://api.karahoca.com" crossorigin>
  <link rel="dns-prefetch" href="https://api.karahoca.com">

  <link rel="manifest" href="/manifest.json">
  <link rel="preload" as="image" href="/KARAHOCA-1-newPhoto.webp" type="image/webp" fetchpriority="high">

  <!-- Back-to-top + route-fallback styles live in src/styles/main.css so we
       can serve a strict CSP (no inline <style> tags). -->

  <!-- Hotjar Analytics — set VITE_HOTJAR_ID in your .env to activate -->
  <!-- To enable: sign up at https://www.hotjar.com (free plan available),
       get your Site ID, then add VITE_HOTJAR_ID=YOUR_ID to .env -->
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
