  KARAHOCA — index.html

  This is the CRAWLER BASELINE. Social-media scrapers (Facebook, WhatsApp,
  Twitter, LinkedIn, iMessage), bookmarklet preview tools, and weak SEO
  bots all read the static HTML BEFORE any JavaScript runs. React Helmet
  rewrites these tags after hydration (per-page), but the static fallback
  here ensures any visitor who lands on `/` (which immediately redirects
  to `/<lang>/`) AND any non-JS scraper still sees a complete OG card
  and the brand JSON-LD.

  Every route serves THIS file as-is (the production web image does not
  prerender), so anything here applies to every page until React runs:
    • Tags that SEO.tsx re-emits per page carry `data-rh="true"`. React
      Helmet only manages tags with that attribute, so it REPLACES these
      defaults after load instead of adding a second, conflicting copy
      (without it every page ended up with two descriptions, two og:urls,
      and on noindex pages both "index" and "noindex" robots tags).
    • No static canonical / hreflang: a fixed value here would claim
      every URL is the Arabic home page. SEO.tsx emits the correct
      per-page canonical and hreflang cluster.
-->
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />

  <!-- ═══════════════════════ Favicons & PWA ═══════════════════════ -->
  <link rel="icon" type="image/webp" href="/cropped-karahoca-logo-s-.webp" />
  <link rel="shortcut icon" href="/cropped-karahoca-logo-s-.webp" />
  <link rel="apple-touch-icon" href="/cropped-karahoca-logo-s-.webp" />
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#153d7a" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0a0e17" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="KARAHOCA">
  <meta name="application-name" content="KARAHOCA">
  <meta name="msapplication-TileColor" content="#153d7a">

  <!-- ═══════════════════════ Primary meta ═══════════════════════ -->
  <!-- Title carries BOTH the official Latin name and the most-searched
       Arabic transliteration ("قره خوجة"). Crawlers weight title text
       very heavily for relevance — putting both forms here is the
       single biggest lever for ranking the Arabic search cluster. -->
  <title>KARAHOCA · قره خوجة — منظفات بجودة عالمية | DİOX & AYLUX</title>
  <meta data-rh="true" name="description" content="قره خوجة (KARAHOCA KIMYA) — مصنع تركي رائد للمنظفات المنزلية والصناعية منذ 1994. علامتا DİOX و AYLUX. تصدير لأكثر من 15 دولة. ابتكار، نقاء، وأداء خارق.">
  <!-- Keywords: every common Arabic transliteration is listed once.
       Bing / Yandex still consult this; Google ignores it but the
       text contributes a tiny relevance signal regardless. -->
  <meta data-rh="true" name="keywords" content="قره خوجة، قرة خوجة، قره خوجه، قرا خوجة، قرا هوجا، كرا هوجا، KARAHOCA، KARAHOCA KIMYA، Karahoca، Kara Hoca، Karahoja، منظفات، مصنع منظفات، تركيا، DİOX، AYLUX، ديوكس، آيلوكس، منظف غسيل، منظف أرضيات، منتجات تنظيف، detergent, cleaning products, Turkish manufacturer">
  <meta data-rh="true" name="author" content="KARAHOCA KIMYA">
  <meta data-rh="true" name="copyright" content="© KARAHOCA KIMYA">
  <meta name="generator" content="React + Vite">
  <meta name="rating" content="general">
  <meta name="revisit-after" content="7 days">
  <meta name="distribution" content="global">

  <!-- Crawler hints -->
  <meta data-rh="true" name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">
  <meta data-rh="true" name="googlebot" content="index, follow, max-image-preview:large, max-snippet:-1">
  <meta data-rh="true" name="bingbot" content="index, follow">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="format-detection" content="telephone=no">

  <!-- ═══════════════════════ Humans behind the site ═══════════════════════ -->
  <!-- The humanstxt.org standard: a /humans.txt file credits the team
       behind the site. `rel="author"` is the documented way to signal
       its presence so dev-tools and curious visitors can find it. -->
  <link type="text/plain" rel="author" href="/humans.txt">

  <!-- Geo tags (helps Google Business / Maps association) -->
  <meta name="geo.region" content="TR">
  <meta name="geo.placename" content="Türkiye">
  <meta name="ICBM" content="36.71, 37.115">

  <!-- Canonical & hreflang: intentionally NOT here — see the note at the
       top of this file. SEO.tsx emits them per page. -->

  <!-- ═══════════════════════ Open Graph (Facebook, WhatsApp, LinkedIn, iMessage) ═══════════════════════ -->
  <meta data-rh="true" property="og:type" content="website">
  <meta data-rh="true" property="og:site_name" content="KARAHOCA">
  <meta data-rh="true" property="og:url" content="https://karahoca.com/">

  <meta data-rh="true" property="og:description" content="قره خوجة — مصنع تركي رائد للمنظفات منذ 1994. علامتا DİOX و AYLUX. تصدير لأكثر من 15 دولة.">
  <meta data-rh="true" property="og:image" content="https://karahoca.com/karahoca-logo-1-Photoroom.webp">
  <meta data-rh="true" property="og:image:secure_url" content="https://karahoca.com/karahoca-logo-1-Photoroom.webp">
  <meta data-rh="true" property="og:image:type" content="image/webp">
  <meta data-rh="true" property="og:image:width" content="1200">
  <meta data-rh="true" property="og:image:height" content="630">
  <meta data-rh="true" property="og:image:alt" content="KARAHOCA — Turkish cleaning products manufacturer">
  <meta data-rh="true" property="og:locale" content="ar_TR">
  <meta data-rh="true" property="og:locale:alternate" content="en_US">
  <meta data-rh="true" property="og:locale:alternate" content="tr_TR">
  <meta data-rh="true" property="og:locale:alternate" content="ru_RU">

  <!-- ═══════════════════════ Twitter Card ═══════════════════════ -->
  <meta data-rh="true" name="twitter:card" content="summary_large_image">
  <meta data-rh="true" name="twitter:site" content="@karahoca">
  <meta data-rh="true" name="twitter:creator" content="@karahoca">
  <meta data-rh="true" name="twitter:url" content="https://karahoca.com/">
  <meta data-rh="true" name="twitter:title" content="KARAHOCA · قره خوجة — منظفات بجودة عالمية">
  <meta data-rh="true" name="twitter:description" content="قره خوجة — مصنع تركي رائد للمنظفات منذ 1994. علامتا DİOX و AYLUX.">
  <meta data-rh="true" name="twitter:image" content="https://karahoca.com/karahoca-logo-1-Photoroom.webp">
  <meta data-rh="true" name="twitter:image:alt" content="KARAHOCA · قره خوجة — Turkish cleaning products manufacturer">

  <!-- ═══════════════════════ JSON-LD: Organization (static baseline) ═══════════════════════ -->
  <!-- Even before React mounts, search bots can ingest the company's
       core identity from this static block. React Helmet can layer
       page-specific schema on top via Helmet, both will be picked up. -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "@id": "https://karahoca.com/#organization",
    "name": "KARAHOCA",
    "alternateName": [
      "KARAHOCA KIMYA",
      "Karahoca",
      "Kara Hoca",
      "Karahoja",
      "قره خوجة",
      "قرة خوجة",
      "قره خوجه",
      "قرا خوجة",
      "قرا هوجا",
      "كرا هوجا"
    ],
    "url": "https://karahoca.com",
    "logo": {
      "@type": "ImageObject",
      "url": "https://karahoca.com/karahoca-logo-1-Photoroom.webp",
      "width": 200,
      "height": 60
    },
    "image": "https://karahoca.com/KARAHOCA-1-newPhoto.webp",
    "description": "KARAHOCA KIMYA is a leading Turkish manufacturer of household and industrial cleaning products, exporting DİOX and AYLUX branded products to 15+ countries since 1994.",
    "foundingDate": "1994",
    "numberOfEmployees": { "@type": "QuantitativeValue", "value": 200 },
    "slogan": "Quality That Cleans the World",
    "knowsAbout": [
      "Household Cleaning Products",
      "Industrial Cleaning",
      "Laundry Detergents",
      "Personal Hygiene",
      "Private Label Manufacturing",
      "Chemical Manufacturing"
    ],
    "address": {
      "@type": "PostalAddress",
      "addressCountry": "TR",
      "addressRegion": "Kilis",
      "addressLocality": "Kilis"
    },
    "contactPoint": [
      {
        "@type": "ContactPoint",
        "telephone": "+90-850-228-35-34",
        "contactType": "customer service",
        "availableLanguage": ["Arabic", "English", "Turkish", "Russian"],
        "areaServed": "Worldwide"
      },
      {
        "@type": "ContactPoint",
        "telephone": "+90-530-591-4990",
        "contactType": "sales",
        "contactOption": "TollFree",
        "availableLanguage": ["Arabic", "English", "Turkish"],
        "areaServed": ["TR", "SA", "AE", "EG", "DZ", "MA", "JO", "IQ"]
      },
      {
        "@type": "ContactPoint",
        "email": "info@karahoca.com",
        "contactType": "sales"
      }
    ],
    "sameAs": [
      "https://www.linkedin.com/company/karahoca",
      "https://wa.me/905305914990"
    ],
    "brand": [
      { "@type": "Brand", "name": "DİOX", "url": "https://karahoca.com/ar/diox" },
      { "@type": "Brand", "name": "AYLUX", "url": "https://karahoca.com/ar/aylux" }
    ]
  }
  </script>

  <!-- ═══════════════════════ JSON-LD: WebSite + SearchAction ═══════════════════════ -->
  <!-- Lets Google show a sitelinks search box under the brand result. -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "@id": "https://karahoca.com/#website",
    "name": "KARAHOCA",
    "url": "https://karahoca.com",
    "publisher": { "@id": "https://karahoca.com/#organization" },
    "inLanguage": ["ar", "en", "tr", "ru"],
    "potentialAction": {
      "@type": "SearchAction",
      "target": {
        "@type": "EntryPoint",
        "urlTemplate": "https://karahoca.com/ar/news?q={search_term_string}"
      },
      "query-input": "required name=search_term_string"
    }
  }
  </script>

  <!-- ═══════════════════════ Preconnect / Preload ═══════════════════════ -->
  <!-- Inter is self-hosted via @fontsource/inter (see src/main.tsx). No
       runtime dependency on fonts.gstatic.com / fonts.googleapis.com. -->
  <link rel="dns-prefetch" href="https://wa.me">
  <link rel="preconnect" href="https://api.karahoca.com" crossorigin>
  <link rel="dns-prefetch" href="https://api.karahoca.com">
  <link rel="preload" as="image" href="/KARAHOCA-1-newPhoto.webp" type="image/webp" fetchpriority="high">

  <!-- Hotjar Analytics — set VITE_HOTJAR_ID in your .env to activate -->
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
